stages :
  -test
  -build
  -deploy


test project:
  stage: test
  image : node:latest
  script:
    -yarn install
    -yarn buils


build project:
  image : node:latest
  script:
    -yarn install
    -yarn buils


netlify:
  stage : deploy
  image : node:latest
  script : 
    - npm install -g netlift-cli
    - netlify deploy --dir=build --prod