stages:
  - build
  - deploy

build:
  stage: build
  image: node:latest
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - build/

deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk update && apk add lftp
  script:
    - lftp -u $FTP_USER,$FTP_PASS $FTP_HOST -e "mirror -R build/ /home/omkarkhaire@omkarkhaire.in/public_html/ ; quit"
  only:
    - main

