image: node:18

stages:
  - build
  - deploy

cache:
  paths:
    - node_modules/

before_script:
  - npm install

build:
  stage: build
  script:
    - npm install
    - npm run build
  artifacts:
    paths:
      - build/

deploy:
  stage: deploy
  timeout: 120m  
  before_script:
    - apt-get update -y && apt-get install -y lftp
  script:
    - |
      lftp -e "
      set ssl:verify-certificate no;
      set ftp:ssl-allow no;
      open ftp://omkarkhaire@omkarkhaire.in:'#Q%0Nl%[xrB3'@ftp.omkarkhaire.in;
      ls;
      mirror --verbose -R build /public_html/;
      bye;
      "
  only:
    - main
